<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bunny's Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #6b8cae;
      --accent-strong: #3e6b8e;
      --accent-soft: #c8d8ec;
      --accent-hover: #add8e6;
      --accent-border: #a0bfd4;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f4f7fb;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      width: 100%;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #f7fafe;
      border-right: 1px solid #e2ecf4;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      transition: left 0.3s ease;
      z-index: 1000;
      box-shadow: 2px 0 16px rgba(0,0,0,0.05);
    }
    .sidebar.open { left: 0; }
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      z-index: 999;
      display: none;
    }
    .sidebar-overlay.show { display: block; }
    .logo {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      padding: 8px 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--accent);
      cursor: pointer;
    }
    .new-chat {
      background: #ffffff;
      border: 1px solid #e2ecf4;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      margin-bottom: 16px;
    }
    .new-chat:hover { background: #eaf1f8; }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-item {
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      color: #5a6a7a;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item.active {
      background: #e4edf7;
      color: var(--accent-strong);
      font-weight: 500;
    }
    .settings-btn {
      margin-top: 16px;
      padding: 10px;
      background: #e4edf7;
      border: none;
      border-radius: 12px;
      color: var(--accent-strong);
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.3s;
    }
    .topbar {
      padding: 12px 16px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(208,224,236,0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .topbar-center {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .topbar-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-strong);
      line-height: 1.2;
    }
    .topbar-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
    }
    .model-select {
      padding: 4px 8px;
      border: 1px solid #e2ecf4;
      border-radius: 10px;
      background: rgba(255,255,255,0.8);
      font-size: 12px;
      color: #5a6a7a;
      outline: none;
      max-width: 120px;
    }
    .menu-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--accent);
      cursor: pointer;
      padding: 0 4px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255,255,255,0.3);
    }
    .message-wrapper {
      display: flex;
      align-items: flex-start;
      max-width: 90%;
    }
    .message-wrapper.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-wrapper.other {
      align-self: flex-start;
      flex-direction: row;
    }
    .message-avatar-wrapper {
      width: 36px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 2px;
    }
    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e4edf7;
      display: block;
    }
    .message-avatar-wrapper.empty { }
    .message-content {
      display: flex;
      flex-direction: column;
      max-width: calc(100% - 46px);
      flex: 1;
    }
    .message-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(80,90,100,0.7);
      margin-bottom: 2px;
      padding: 0 4px;
    }
    .message-sender {
      font-weight: 500;
      color: var(--accent-strong);
    }
    .message-sender.assistant-name {
      font-weight: 700;
    }
    .message-time {
      color: rgba(80,90,100,0.5);
    }
    .message-tokens {
      color: rgba(80,90,100,0.4);
      font-size: 10px;
    }
    .message-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(210,226,240,0.5);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: opacity 0.3s;
    }
    .message-wrapper.self .message-bubble {
      border-bottom-right-radius: 6px;
    }
    .message-wrapper.other .message-bubble {
      border-bottom-left-radius: 6px;
    }
    .attachment-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 14px 4px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(4px);
      border-bottom: 1px solid rgba(208,224,236,0.3);
    }
    .attachment-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(232,239,245,0.6);
      border-radius: 14px;
      padding: 4px 10px 4px 8px;
      font-size: 13px;
      color: var(--accent-strong);
      border: 1px solid rgba(208,224,236,0.4);
    }
    .attachment-item img {
      width: 28px;
      height: 28px;
      object-fit: cover;
      border-radius: 6px;
    }
    .attachment-item .remove-btn {
      background: none;
      border: none;
      color: #8b9aae;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 2px;
    }
    .input-area {
      padding: 8px 14px 14px;
      border-top: 1px solid rgba(208,224,236,0.4);
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      width: 100%;
    }
    .attach-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--accent);
      cursor: pointer;
      padding: 4px;
      height: 40px;
      display: flex;
      align-items: center;
    }
    .input-box {
      flex: 1;
      resize: none;
      border: 1px solid rgba(210,226,240,0.6);
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      color: #4a5a6a;
      outline: none;
      transition: border-color 0.2s;
      max-height: 100px;
      min-height: 40px;
      background: rgba(255,255,255,0.8);
    }
    .input-box:focus {
      border-color: var(--accent-border);
    }
    .send-btn {
      background: var(--accent-soft);
      border: none;
      border-radius: 22px;
      padding: 10px 18px;
      font-size: 14px;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
      font-weight: 500;
      white-space: nowrap;
      height: 40px;
      display: flex;
      align-items: center;
    }
    .send-btn:hover {
      background: var(--accent-hover);
    }
    .send-btn:disabled {
      background: #e5edf5;
      cursor: not-allowed;
    }
    .settings-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .settings-panel.show { display: flex; }
    .settings-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 20px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 16px 48px rgba(0,0,0,0.12);
    }
    .settings-card h3 {
      color: var(--accent-strong);
      margin-bottom: 16px;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
    }
    .settings-card h3 button {
      background: none;
      border: none;
      font-size: 22px;
      color: #8b9aae;
      cursor: pointer;
    }
    .settings-group {
      margin-bottom: 16px;
    }
    .settings-group label {
      display: block;
      font-size: 13px;
      color: #6a7a8e;
      margin-bottom: 4px;
    }
    .settings-group input,
    .settings-group select,
    .settings-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2ecf4;
      border-radius: 12px;
      font-size: 14px;
      background: #fcfaff;
      color: #4a5a6a;
      font-family: inherit;
    }
    .settings-group textarea {
      resize: vertical;
      min-height: 60px;
    }
    .settings-group .avatar-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }
    .settings-group .avatar-preview img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-soft);
    }
    .settings-group .file-input-wrap {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .settings-group .file-input-wrap input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .settings-group .file-input-wrap .file-label {
      display: block;
      padding: 8px 12px;
      border: 1px dashed #bccfe0;
      border-radius: 12px;
      text-align: center;
      color: var(--accent);
      background: #f4f8fc;
      font-size: 14px;
    }
    .settings-group .bg-preview {
      margin-top: 8px;
      width: 100%;
      height: 90px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      border: 1px solid #e2ecf4;
    }
    .settings-save {
      width: 100%;
      padding: 10px;
      background: var(--accent-soft);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .settings-save:hover { background: var(--accent-hover); }

    /* ---- 我的主页（整页） ---- */
    .profile-page {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 3000;
      display: none;
      flex-direction: column;
    }
    .profile-page.show { display: flex; }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 14px 16px;
      border-bottom: 1px solid #e2ecf4;
      flex-shrink: 0;
    }
    .profile-header .back-btn {
      background: none;
      border: none;
      font-size: 28px;
      color: var(--accent-strong);
      cursor: pointer;
      padding: 0 10px 0 0;
      line-height: 1;
    }
    .profile-header .profile-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-strong);
    }
    .profile-body {
      flex: 1;
      overflow-y: auto;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .profile-avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .profile-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background-color: #eef3f9;
      background-size: cover;
      background-position: center;
      border: 3px solid var(--accent-soft);
    }
    .profile-avatar-change {
      font-size: 14px;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    /* ---- 开屏 ---- */
    .splash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s ease;
    }
    .splash.fade-out { opacity: 0; pointer-events: none; }
    .splash-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 8px;
      color: var(--accent);
      opacity: 0;
      animation: welcomeIn 1s ease forwards;
    }
    .splash-sub {
      margin-top: 8px;
      font-size: 14px;
      color: var(--accent-strong);
      opacity: 0;
      animation: welcomeIn 1s ease 0.4s forwards;
    }
    @keyframes welcomeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* ---- 主题色 ---- */
    .theme-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .theme-row input[type="color"] {
      width: 42px; height: 34px; padding: 0; border: none; background: none; cursor: pointer;
    }
    .theme-swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid #fff; box-shadow: 0 0 0 1px #d0e0ec;
    }
    .api-hint { font-size: 12px; color: #8b9aae; margin: -6px 0 12px; }
  </style>
</head>
<body>
<div class="splash" id="splash">
  <div class="splash-title">WELCOME</div>
  <div class="splash-sub">Bunny's Home</div>
</div>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      🐰 Bunny's Home
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat" onclick="newChat(); toggleSidebar();">＋ 新的对话</button>
    <div class="chat-list" id="chatList"></div>
    <button class="settings-btn" onclick="openSettings()">对话设置</button>
    <button class="settings-btn" onclick="openProfile()">我的主页</button>
    <button class="settings-btn" onclick="openApiSettings()">API 设置</button>
    <button class="settings-btn" onclick="openProactive()">主动消息</button>
  </aside>

  <main class="main" id="mainArea">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      </div>
      <div class="topbar-center">
        <span class="topbar-title" id="chatTitle">Sui</span>
      </div>
      <div class="topbar-right">
        <select class="model-select" id="modelSelect" onchange="changeModel()">
          <optgroup label="DeepSeek">
            <option value="deepseek-chat">DeepSeek Chat</option>
            <option value="deepseek-reasoner">DeepSeek Reasoner</option>
          </optgroup>
          <optgroup label="OpenAI">
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4o-mini">GPT-4o mini</option>
          </optgroup>
          <optgroup label="Claude">
            <option value="claude-sonnet-5">Claude Sonnet 5</option>
            <option value="claude-opus-5">Claude Opus 5</option>
          </optgroup>
        </select>
      </div>
    </header>

    <div class="attachment-preview" id="attachmentPreview"></div>
    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-row">
        <button class="attach-btn" id="attachBtn" title="上传文件或图片">📎</button>
        <textarea class="input-box" id="inputBox" rows="1" placeholder="输入消息与AI聊天..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
      <input type="file" id="fileInput" accept="image/*,.txt,.pdf,.doc,.docx,.xls,.xlsx,.pptx" style="display:none" multiple>
    </div>
  </main>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-card">
      <h3>
        ⚙️ 对话设置
        <button onclick="closeSettings()">✕</button>
      </h3>
      <div class="settings-group">
        <label>助手头像</label>
        <div class="file-input-wrap">
          <span class="file-label">📁 选择图片</span>
          <input type="file" id="assistantAvatarInput" accept="image/*" onchange="previewAssistantAvatar(this)">
        </div>
        <div class="avatar-preview">
          <img id="assistantAvatarPreview" src="" alt="预览" style="display:none;">
          <span style="font-size:12px;color:#8b9aae;">建议正方形</span>
        </div>
      </div>
      <div class="settings-group">
        <label>AI 名字</label>
        <input type="text" id="aiNameInput" placeholder="例如：Sui">
      </div>
      <div class="settings-group">
        <label>系统提示词</label>
        <textarea id="systemPromptInput" placeholder="设定 AI 的角色、行为准则等"></textarea>
      </div>
      <div class="settings-group">
        <label>聊天背景</label>
        <div class="file-input-wrap">
          <span class="file-label">📁 选择背景图片</span>
          <input type="file" id="bgFileInput" accept="image/*" onchange="previewBackground(this)">
        </div>
        <div class="bg-preview" id="bgPreview" style="display:none;"></div>
      </div>
      <div class="settings-group">
        <label>气泡透明度：<span id="opacityValue">0.9</span></label>
        <input type="range" id="opacitySlider" min="0.1" max="1" step="0.05" value="0.9">
      </div>
      <div class="settings-group">
        <label>主题颜色</label>
        <div class="theme-row">
          <input type="color" id="themeColorInput" value="#6b8cae" oninput="themeColorInputChange()">
          <span class="theme-swatch" style="background:#6b8cae" onclick="pickTheme('#6b8cae')"></span>
          <span class="theme-swatch" style="background:#7c6ba8" onclick="pickTheme('#7c6ba8')"></span>
          <span class="theme-swatch" style="background:#a86b8c" onclick="pickTheme('#a86b8c')"></span>
          <span class="theme-swatch" style="background:#6ba87e" onclick="pickTheme('#6ba87e')"></span>
          <span class="theme-swatch" style="background:#b08a5a" onclick="pickTheme('#b08a5a')"></span>
        </div>
      </div>
      <button class="settings-save" onclick="saveSettings()">保存设置</button>
    </div>
  </div>

  <div class="profile-page" id="profilePage">
    <div class="profile-header">
      <button class="back-btn" onclick="closeProfile()">‹</button>
      <span class="profile-title">我的主页</span>
    </div>
    <div class="profile-body">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="profileAvatarPreview"></div>
        <label class="profile-avatar-change" for="profileAvatarInput">更换头像</label>
        <input type="file" id="profileAvatarInput" accept="image/*" style="display:none">
      </div>
      <div class="settings-group">
        <label>昵称</label>
        <input type="text" id="profileNameInput" placeholder="给自己起个昵称（消息里会显示）">
      </div>
      <div class="settings-group">
        <label>个性签名（AI 会读取，回复更懂你）</label>
        <textarea id="profileSignatureInput" placeholder="介绍一下你自己，比如：我叫 Elliott，喜欢摄影和猫…"></textarea>
      </div>
      <button class="settings-save" onclick="saveProfile()">保存</button>
    </div>
  </div>

  <div class="settings-panel" id="apiPanel">
    <div class="settings-card">
      <h3>
        🔑 API 设置
        <button onclick="closeApiSettings()">✕</button>
      </h3>
      <p class="api-hint">密钥存在服务器，只显示打码。留空 = 不修改。</p>
      <div class="settings-group">
        <label>DeepSeek Key</label>
        <input type="password" id="deepseekKeyInput" placeholder="sk-...">
        <label>DeepSeek 中转地址</label>
        <input type="text" id="deepseekBaseInput" placeholder="https://api.deepseek.com/v1">
      </div>
      <div class="settings-group">
        <label>OpenAI Key</label>
        <input type="password" id="openaiKeyInput" placeholder="sk-...">
        <label>OpenAI 中转地址</label>
        <input type="text" id="openaiBaseInput" placeholder="https://api.openai.com/v1">
      </div>
      <div class="settings-group">
        <label>Claude Key</label>

<script>
  // 后端地址：已部署到 Render。本地调试时改成 http://localhost:3001
  const API_BASE = 'https://bunny-backend-bv89.onrender.com';

  // ---- 服务端状态 ----
  let sessions = [];        // [{ id, name, created_at, updated_at }]
  let currentSessionId = null;
  let messages = [];        // 当前会话的可见消息（本地展示结构）
  let attachments = [];

  // ---- 本地外观设置（存 localStorage，跨会话生效）----
  const LS_KEY = 'bunny_home_settings_v1';
  let appSettings = loadLocalSettings();

  function loadLocalSettings() {
    const defaults = { aiName: 'Sui', userName: '', assistantAvatar: '', userAvatar: '', background: '', bubbleOpacity: 0.9, model: 'deepseek-chat', themeColor: '#6b8cae' };
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return { ...defaults, ...JSON.parse(raw) };
    } catch (e) {}
    return defaults;
  }
  function saveLocalSettings() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(appSettings)); } catch (e) {}
  }

  // ---- 主题色 ----
  function setThemeColor(hex) {
    const root = document.documentElement;
    root.style.setProperty('--accent', hex);
    const { h, s, l } = hexToHsl(hex);
    root.style.setProperty('--accent-strong', hslToHex(h, s, Math.max(0, l - 0.16)));
    root.style.setProperty('--accent-soft', hslToHex(h, s * 0.5, Math.min(0.95, l + 0.38)));
    root.style.setProperty('--accent-hover', hslToHex(h, s, Math.min(1, l + 0.12)));
    root.style.setProperty('--accent-border', hslToHex(h, s, Math.min(1, l + 0.18)));
  }
  function hexToHsl(hex) {
    let r = parseInt(hex.slice(1, 3), 16) / 255;
    let g = parseInt(hex.slice(3, 5), 16) / 255;
    let b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0, l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h /= 6;
    }
    return { h: h * 360, s, l };
  }
  function hslToHex(h, s, l) {
    s = Math.max(0, Math.min(1, s));
    l = Math.max(0, Math.min(1, l));
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    const to = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return '#' + to(r) + to(g) + to(b);
  }
  function pickTheme(hex) {
    appSettings.themeColor = hex;
    document.getElementById('themeColorInput').value = hex;
    setThemeColor(hex);
    saveLocalSettings();
  }
  function themeColorInputChange() {
    pickTheme(document.getElementById('themeColorInput').value);
  }

  const messagesContainer = document.getElementById('messages');
  const chatListEl = document.getElementById('chatList');
  const chatTitle = document.getElementById('chatTitle');
  const mainArea = document.getElementById('mainArea');
  const inputBox = document.getElementById('inputBox');
  const sendBtn = document.getElementById('sendBtn');
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const attachmentPreview = document.getElementById('attachmentPreview');

  const settingsPanel = document.getElementById('settingsPanel');
  const aiNameInput = document.getElementById('aiNameInput');
  const systemPromptInput = document.getElementById('systemPromptInput');
  const bgFileInput = document.getElementById('bgFileInput');
  const opacitySlider = document.getElementById('opacitySlider');
  const opacityValue = document.getElementById('opacityValue');
  const assistantAvatarInput = document.getElementById('assistantAvatarInput');
  const assistantAvatarPreview = document.getElementById('assistantAvatarPreview');

  // ---- 工具 ----
  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderText(s) {
    return escapeHtml(s).replace(/\n/g, '<br>');
  }
  function mapMessage(m) {
    const usage = (m.metadata && m.metadata.usage) || {};
    const total = usage.total_tokens;
    return {
      id: m.id,
      role: m.role,
      content: m.content || '',
      time: m.created_at ? new Date(m.created_at).toLocaleString() : '',
      tokens: total ? total + ' tokens' : '',
    };
  }

  function cropSquareImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const size = Math.min(img.width, img.height);
          const canvas = document.createElement('canvas');
          canvas.width = 200;
          canvas.height = 200;
          const ctx = canvas.getContext('2d');
          const sx = (img.width - size) / 2;
          const sy = (img.height - size) / 2;
          ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200);
          resolve(canvas.toDataURL('image/png'));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.target.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  function readFileContent(file) {
    return new Promise((resolve) => {
      if (file.type.startsWith('text/') || file.name.endsWith('.txt')) {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsText(file);
      } else {
        resolve(null);
      }
    });
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }

  // ---- 数据加载 ----
  async function loadSessions() {
    const resp = await fetch(`${API_BASE}/api/sessions`);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    sessions = data.sessions || [];
  }

  async function loadMessages() {
    const resp = await fetch(`${API_BASE}/api/sessions/${currentSessionId}/messages?limit=500`);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    messages = (data.messages || [])
      .filter((m) => m.visible !== false)
      .map(mapMessage);
  }

  async function createServerSession(name) {
    const resp = await fetch(`${API_BASE}/api/sessions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name || '新的对话' }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    return data.session;
  }

  // ---- 渲染 ----
  function updateTitle() {
    const cur = sessions.find((s) => s.id === currentSessionId);
    chatTitle.textContent = appSettings.aiName || (cur && cur.name) || 'Sui';
  }

  function applyAppearance() {
    mainArea.style.backgroundImage = appSettings.background ? `url(${appSettings.background})` : '';
    document.getElementById('modelSelect').value = appSettings.model || 'deepseek-chat';
    setThemeColor(appSettings.themeColor || '#6b8cae');
  }

  function renderMessages() {
    messagesContainer.innerHTML = '';
    let lastRole = null;

    const list = messages.length === 0
      ? [{ role: 'assistant', content: "嘿，这是 Bunny's Home。\n想聊点什么？", time: '', tokens: '' }]
      : messages;

    list.forEach((msg) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ' + (msg.role === 'user' ? 'self' : 'other');

      const showHeader = (lastRole !== msg.role);
      lastRole = msg.role;

      const avatarWrapper = document.createElement('div');
      avatarWrapper.className = 'message-avatar-wrapper';
      if (showHeader) {
        const avatarSrc = msg.role === 'user' ? appSettings.userAvatar : appSettings.assistantAvatar;
        if (avatarSrc) {
          const avatar = document.createElement('img');
          avatar.className = 'message-avatar';
          avatar.src = avatarSrc;
          avatarWrapper.appendChild(avatar);
        } else {
          avatarWrapper.classList.add('empty');
        }
      } else {
        avatarWrapper.classList.add('empty');
      }
      wrapper.appendChild(avatarWrapper);

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      const meta = document.createElement('div');
      meta.className = 'message-meta';
      let metaHTML = `<span class="message-time">${escapeHtml(msg.time || '')}</span>`;
      if (msg.role === 'user') {
        if (showHeader) metaHTML = `<span class="message-sender">${escapeHtml(appSettings.userName || '我')}</span> ${metaHTML}`;
      } else {
        if (showHeader) metaHTML = `<span class="message-sender assistant-name">${escapeHtml(appSettings.aiName || 'AI')}</span> ${metaHTML}`;
        if (msg.tokens) metaHTML += ` <span class="message-tokens">${escapeHtml(msg.tokens)}</span>`;
      }
      meta.innerHTML = metaHTML;

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = msg.thinking ? '正在思考…' : renderText(msg.content);
      bubble.style.opacity = appSettings.bubbleOpacity || 0.9;

      contentDiv.appendChild(meta);
      contentDiv.appendChild(bubble);
      wrapper.appendChild(contentDiv);
      messagesContainer.appendChild(wrapper);
    });
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function renderChatList() {
    chatListEl.innerHTML = '';
    sessions.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (s.id === currentSessionId ? ' active' : '');
      div.textContent = s.name || '未命名';
      div.onclick = () => switchSession(i);
      chatListEl.appendChild(div);
    });
  }

  // ---- 会话操作 ----
  async function switchSession(i) {
    currentSessionId = sessions[i].id;
    updateTitle();
    renderChatList();
    closeSettings();
    attachments = [];
    renderAttachments();
    messages = [];
    renderMessages();
    try {
      await loadMessages();
      renderMessages();
    } catch (e) {
      messages = [{ role: 'assistant', content: '加载消息失败：' + e.message, time: '', error: true }];
      renderMessages();
    }
  }

  async function newChat() {
    try {
      const session = await createServerSession('新的对话');
      sessions.unshift(session);
      currentSessionId = session.id;
      messages = [];
      updateTitle();
      renderChatList();
      renderMessages();
    } catch (e) {
      alert('新建会话失败：' + e.message);
    }
  }

  // ---- 设置 ----
  async function openSettings() {
    aiNameInput.value = appSettings.aiName || '';
    systemPromptInput.value = '';
    opacitySlider.value = appSettings.bubbleOpacity || 0.9;
    opacityValue.textContent = appSettings.bubbleOpacity || 0.9;
    document.getElementById('themeColorInput').value = appSettings.themeColor || '#6b8cae';

    if (appSettings.assistantAvatar) {
      assistantAvatarPreview.src = appSettings.assistantAvatar;
      assistantAvatarPreview.style.display = 'inline-block';
    } else {
      assistantAvatarPreview.style.display = 'none';
    }
    settingsPanel.classList.add('show');

    // 拉取服务端 system_prompt
    try {
      const resp = await fetch(`${API_BASE}/api/sessions/${currentSessionId}/settings`);
      if (resp.ok) {
        const data = await resp.json();
        systemPromptInput.value = data.settings?.system_prompt || '';
      }
    } catch (e) {}
  }

  function closeSettings() {
    settingsPanel.classList.remove('show');
  }

  async function previewAssistantAvatar(input) {
    if (!input.files[0]) return;
    const dataUrl = await cropSquareImage(input.files[0]);
    assistantAvatarPreview.src = dataUrl;
    assistantAvatarPreview.style.display = 'inline-block';
    appSettings.assistantAvatar = dataUrl;
    renderMessages();
  }
  async function previewBackground(input) {
    if (!input.files[0]) return;
    const dataUrl = await readAsDataURL(input.files[0]);
    const bgPreview = document.getElementById('bgPreview');
    bgPreview.style.backgroundImage = `url(${dataUrl})`;
    bgPreview.style.display = 'block';
    appSettings.background = dataUrl;
    applyAppearance();
  }

  async function saveSettings() {
    appSettings.aiName = aiNameInput.value.trim() || 'AI';
    appSettings.bubbleOpacity = parseFloat(opacitySlider.value);

    if (assistantAvatarInput.files[0]) {
      appSettings.assistantAvatar = await cropSquareImage(assistantAvatarInput.files[0]);
    }
    if (bgFileInput.files[0]) {
      appSettings.background = await readAsDataURL(bgFileInput.files[0]);
    }

    saveLocalSettings();
    updateTitle();
    applyAppearance();
    renderChatList();
    renderMessages();
    closeSettings();

    // 系统提示词存服务端（会话级）
    try {
      const resp = await fetch(`${API_BASE}/api/sessions/${currentSessionId}/settings`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_prompt: systemPromptInput.value.trim() }),
      });
      if (!resp.ok) console.warn('保存系统提示词失败', resp.status);
    } catch (e) {
      console.warn('保存系统提示词失败', e);
    }
  }

  function changeModel() {
    appSettings.model = document.getElementById('modelSelect').value;
    saveLocalSettings();
  }

  // ---- 个人主页（整页）：头像 / 昵称 / 个性签名 ----
  let pendingProfileAvatar = null;
  async function openProfile() {
    const av = document.getElementById('profileAvatarPreview');
    av.style.backgroundImage = appSettings.userAvatar ? `url(${appSettings.userAvatar})` : '';
    document.getElementById('profileNameInput').value = appSettings.userName || '';
    document.getElementById('profilePage').classList.add('show');
    // 个性签名从服务端回填
    try {
      const resp = await fetch(`${API_BASE}/api/settings`);

      }

  }
  function closeProfile() {
    document.getElementById('profilePage').classList.remove('show');
  }
  async function saveProfile() {
    if (pendingProfileAvatar) {
      appSettings.userAvatar = pendingProfileAvatar;
      pendingProfileAvatar = null;
    }
    appSettings.userName = document.getElementById('profileNameInput').value.trim();
    saveLocalSettings();
    updateTitle();
    renderMessages();

    const signature = document.getElementById('profileSignatureInput').value.trim();
    let sigOk = true;
    try {
      const resp = await fetch(`${API_BASE}/api/settings`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ personal_signature: signature }),
      });
      if (!resp.ok) sigOk = false;
    } catch (e) { sigOk = false; }

    closeProfile();
    alert(sigOk ? '已保存 ✓' : '头像/昵称已保存，但签名保存失败（检查服务器）');
  }
  document.getElementById('profileAvatarInput').addEventListener('change', async function (e) {
    const f = e.target.files[0];
    if (!f) return;
    pendingProfileAvatar = await cropSquareImage(f);
    document.getElementById('profileAvatarPreview').style.backgroundImage = `url(${pendingProfileAvatar})`;
  });

  // ---- API 密钥 ----

    document.getElementById('apiPanel').classList.add('show');
    try {
      const resp = await fetch(`${API_BASE}/api/settings`);
      if (resp.ok) {
        const data = await resp.json();
        const s = data.settings || {};
        const deepseekKeyEl = document.getElementById('deepseekKeyInput');
        const openaiKeyEl = document.getElementById('openaiKeyInput');
        const anthropicKeyEl = document.getElementById('anthropicKeyInput');
        deepseekKeyEl.value = s.deepseek_api_key || '';
        deepseekKeyEl.placeholder = s.deepseek_key_set ? '已保存（留空则不变）' : 'sk-...';
        openaiKeyEl.value = s.openai_api_key || '';
        openaiKeyEl.placeholder = s.openai_key_set ? '已保存（留空则不变）' : 'sk-...';
        anthropicKeyEl.value = s.anthropic_api_key || '';
        anthropicKeyEl.placeholder = s.anthropic_key_set ? '已保存（留空则不变）' : 'sk-ant-...';
        document.getElementById('deepseekBaseInput').value = s.deepseek_base_url || '';
        document.getElementById('openaiBaseInput').value = s.openai_base_url || '';
        document.getElementById('anthropicBaseInput').value = s.anthropic_base_url || '';
        document.getElementById('anthropicProtocolSelect').value = s.anthropic_protocol || 'anthropic';
      }
    } catch (e) {}
  }
  function closeApiSettings() {
    document.getElementById('apiPanel').classList.remove('show');
  }
  async function saveApiSettings() {
    const body = {};
    const deepseekKeyVal = document.getElementById('deepseekKeyInput').value.trim();
    const openaiKeyVal = document.getElementById('openaiKeyInput').value.trim();
    const anthropicKeyVal = document.getElementById('anthropicKeyInput').value.trim();
    // 只有用户输入了明文才提交（留空 / 打码占位都不发，避免覆盖）
    if (deepseekKeyVal && !deepseekKeyVal.includes('•')) body.deepseek_api_key = deepseekKeyVal;
    if (openaiKeyVal && !openaiKeyVal.includes('•')) body.openai_api_key = openaiKeyVal;
    if (anthropicKeyVal && !anthropicKeyVal.includes('•')) body.anthropic_api_key = anthropicKeyVal;
    body.deepseek_base_url = document.getElementById('deepseekBaseInput').value.trim();
    body.openai_base_url = document.getElementById('openaiBaseInput').value.trim();
    body.anthropic_base_url = document.getElementById('anthropicBaseInput').value.trim();
    body.anthropic_protocol = document.getElementById('anthropicProtocolSelect').value;
    try {
      const resp = await fetch(`${API_BASE}/api/settings`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      closeApiSettings();
      alert('API 设置已保存 ✓');
    } catch (e) {
      alert('保存失败：' + e.message);
    }
  }

  // ---- 主动消息 ----
  async function openProactive() {
    document.getElementById('proactivePanel').classList.add('show');

      const resp = await fetch(`${API_BASE}/api/settings`);

        document.getElementById('proactiveNoonEnabledSelect').value = s.proactive_noon_enabled ? '1' : '0';
        document.getElementById('proactiveNoonTimeInput').value = s.proactive_noon_time || '12:00';
        document.getElementById('proactiveNightEnabledSelect').value = s.proactive_night_enabled ? '1' : '0';
        document.getElementById('proactiveNightTimeInput').value = s.proactive_night_time || '22:00';
        document.getElementById('proactiveIdleEnabledSelect').value = s.proactive_idle_enabled ? '1' : '0';
        document.getElementById('proactiveIdleHoursInput').value = (s.proactive_idle_hours == null ? '' : s.proactive_idle_hours);
        document.getElementById('barkUrlInput').value = s.bark_url || '';
        document.getElementById('replyNotifyEnabledSelect').value = s.reply_notify_enabled ? '1' : '0';
      }
    } catch (e) {}
  }
  function closeProactive() {
    document.getElementById('proactivePanel').classList.remove('show');
  }
  async function saveProactive() {
    const idleRaw = document.getElementById('proactiveIdleHoursInput').value.trim();
    const body = {
      proactive_morning_enabled: document.getElementById('proactiveMorningEnabledSelect').value === '1',
      proactive_morning_time: document.getElementById('proactiveMorningTimeInput').value,
      proactive_noon_enabled: document.getElementById('proactiveNoonEnabledSelect').value === '1',
      proactive_noon_time: document.getElementById('proactiveNoonTimeInput').value,
      proactive_night_enabled: document.getElementById('proactiveNightEnabledSelect').value === '1',
      proactive_night_time: document.getElementById('proactiveNightTimeInput').value,
      proactive_idle_enabled: document.getElementById('proactiveIdleEnabledSelect').value === '1',
      proactive_idle_hours: idleRaw === '' ? null : Number(idleRaw),
      bark_url: document.getElementById('barkUrlInput').value.trim(),
      reply_notify_enabled: document.getElementById('replyNotifyEnabledSelect').value === '1',
    };
    try {
      const resp = await fetch(`${API_BASE}/api/settings`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      closeProactive();
      alert('主动消息设置已保存 ✓');
    } catch (e) {
      alert('保存失败：' + e.message);
    }
  }

  // 打开页面时触发一次心跳：若 AI 刚主动发了消息，刷新会话与消息
  async function checkProactive() {
    try {
      const resp = await fetch(`${API_BASE}/api/proactive`);
      if (!resp.ok) return;
      const data = await resp.json();
      if (!data.sent) return;
      await loadSessions();
      renderChatList();
      if (data.sessionId === currentSessionId) {
        await loadMessages();
        renderMessages();
      }
    } catch (e) {}
  }

  // ---- 附件 ----
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    files.forEach((file) => {
      if (file.size > 10 * 1024 * 1024) {
        alert('文件过大（超过10MB）');
        return;
      }
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          attachments.push({ file: file, dataUrl: ev.target.result, name: file.name, size: file.size, type: file.type });
          renderAttachments();
        };
        reader.readAsDataURL(file);
      } else {
        attachments.push({ file: file, dataUrl: null, name: file.name, size: file.size, type: file.type });
        renderAttachments();
      }
    });
    fileInput.value = '';
  });

  function renderAttachments() {
    attachmentPreview.innerHTML = '';
    attachments.forEach((att, index) => {
      const item = document.createElement('span');
      item.className = 'attachment-item';
      if (att.dataUrl && att.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = att.dataUrl;
        item.appendChild(img);
      } else {
        const icon = document.createElement('span');
        icon.textContent = '📄';
        item.appendChild(icon);
      }
      const nameSpan = document.createElement('span');
      nameSpan.textContent = att.name;
      item.appendChild(nameSpan);
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '×';
      removeBtn.onclick = function(e) {
        e.stopPropagation();
        attachments.splice(index, 1);
        renderAttachments();
      };
      item.appendChild(removeBtn);
      attachmentPreview.appendChild(item);
    });
  }

  // ---- 发送消息 ----
  async function sendMessage() {
    const text = inputBox.value.trim();
    if (!text && attachments.length === 0) return;
    if (!currentSessionId) { alert('还没有会话'); return; }

    const now = new Date().toLocaleString();
    let userContent = text;
    if (attachments.length > 0) {
      const fileInfos = [];
      for (const att of attachments) {
        if (att.type.startsWith('image/')) {
          fileInfos.push(`[图片: ${att.name}]`);
        } else {
          const content = await readFileContent(att.file);
          fileInfos.push(content !== null ? `[文件: ${att.name}]\n${content}` : `[文件: ${att.name}] (非文本文件)`);
        }
      }
      userContent = userContent ? userContent + '\n\n' + fileInfos.join('\n\n') : fileInfos.join('\n\n');
    }

    const userMsg = { role: 'user', content: userContent, time: now, pendingUser: true };
    const thinking = { role: 'assistant', content: '', time: now, thinking: true };
    messages.push(userMsg);
    messages.push(thinking);
    inputBox.value = '';
    autoResize(inputBox);
    attachments = [];
    renderAttachments();
    renderMessages();
    sendBtn.disabled = true;

    try {
      const resp = await fetch(`${API_BASE}/api/sessions/${currentSessionId}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: userContent,
          model: appSettings.model || 'deepseek-chat',
          // 用户正盯着当前页面时不推 Bark；切走/锁屏才推
          notify: !(document.visibilityState === 'visible' && document.hasFocus()),
        }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));

      messages = messages.filter((m) => m !== thinking && !m.pendingUser);
      if (data.compressed) {
        await loadMessages();   // 压缩后旧消息已隐藏，重新拉取
        messages.push({ role: 'assistant', content: '（已自动整理历史记忆）', time: now, note: true });
      } else {
        messages.push(mapMessage(data.userMessage));
        messages.push(mapMessage(data.assistantMessage));
      }
    } catch (err) {
      messages = messages.filter((m) => m !== thinking && !m.pendingUser);
      messages.push({ role: 'assistant', content: '❌ 请求失败：' + err.message, time: new Date().toLocaleString(), error: true });
    }
    sendBtn.disabled = false;
    renderMessages();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  // ---- 启动 ----
  inputBox.addEventListener('input', function() { autoResize(this); });
  opacitySlider.addEventListener('input', function() {
    opacityValue.textContent = this.value;
  });

  applyAppearance();
  updateTitle();
  renderChatList();
  renderMessages();

  // 开屏约 3 秒后淡出
  setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash) {
      splash.classList.add('fade-out');
      setTimeout(() => splash.remove(), 700);
    }
  }, 3000);

  (async function init() {
    try {
      await loadSessions();
      if (sessions.length === 0) {
        const session = await createServerSession('新的对话');
        sessions = [session];
      }
      currentSessionId = sessions[0].id;
      updateTitle();
      renderChatList();
      await loadMessages();
      renderMessages();
      checkProactive();   // 心跳：打开页面时让 AI 有机会主动来一条
    } catch (e) {
      messages = [{ role: 'assistant', content: '连接服务器失败：' + e.message + '。可能是免费实例冷启动中，稍等几秒后刷新页面重试。', time: '', error: true }];
      renderMessages();
    }
  })();
</script>
</body>
</html>
